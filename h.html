<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homenagem - Eterno Amor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Cormorant+Garamond:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(ellipse at top, #1a0a0a 0%, #0a0a0a 50%, #000 100%);
            color: #fff; margin: 0; padding: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
    .card {
            max-width: 650px;
            background: linear-gradient(145deg, rgba(26,26,26,0.9) 0%, rgba(10,10,10,0.95) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,77,121,0.3);
            border-radius: 30px; padding: 60px 40px; text-align: center; position: relative;
            box-shadow: 0 20px 60px rgba(255,77,121,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
        }
    .card::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #FF4D79, #FF8C42, #FF4D79);
            border-radius: 30px; z-index: -1; opacity: 0.3; filter: blur(20px);
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            color: #fff; font-size: 3.5rem; margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(255,77,121,0.5);
            font-weight: 700;
        }
    .data { color: #FFD166; font-size: 1.1rem; margin-bottom: 40px; letter-spacing: 3px; text-transform: uppercase; }
    .contador {
            font-family: 'Cormorant Garamond', serif;
            font-size: 4rem;
            background: linear-gradient(135deg, #FF4D79 0%, #FF8C42 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700; margin: 40px 0;
        }
    .mensagem {
            font-size: 1.2rem; line-height: 2; color: #e0e0e0; margin: 40px 0;
            font-family: 'Cormorant Garamond', serif; font-style: italic;
        }
    .fotos { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin: 40px 0; }
    .fotos img {
            width: 140px; height: 140px; object-fit: cover; border-radius: 20px;
            border: 3px solid rgba(255,77,121,0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s;
        }
    .fotos img:hover { transform: scale(1.05); }
    .musica { margin-top: 30px; position: relative; }
    .erro { text-align: center; padding: 50px; }
    </style>
</head>
<body>
    <div id="conteudo">
        <div class="card">
            <h1 id="titulo">Carregando...</h1>
            <div class="data" id="dataTexto"></div>
            <div class="contador" id="contador"></div>
            <div class="mensagem" id="mensagem"></div>
            <div class="fotos" id="fotos"></div>
            <div class="musica" id="musica"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDuxYHTUyNZav6ewBDVw6OlwYi_h65AGow",
            authDomain: "eterno-amor-prod.firebaseapp.com",
            projectId: "eterno-amor-prod",
            storageBucket: "eterno-amor-prod.firebasestorage.app",
            messagingSenderId: "319651524702",
            appId: "1:319651524702:web:e3ad61bd143633b4cac4cf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const isDemo = urlParams.get('demo') === 'true' || id?.startsWith('demo-');

        async function carregar() {
            let dados;

            if (isDemo) {
                // MODO DEMO - PEGA DO LOCALSTORAGE
                dados = JSON.parse(localStorage.getItem(id));

                if (!dados) {
                    document.getElementById('conteudo').innerHTML = '<div class="erro"><h1>Demo expirada</h1><p>Crie uma nova na página inicial.</p></div>';
                    return;
                }

                // MARCA D'ÁGUA NÍVEL PREMIUM
                const tarja = document.createElement('div');
                tarja.innerHTML = `
                    <div style="font-size:14px;opacity:0.9;">VISUALIZAÇÃO BLOQUEADA</div>
                    <div style="font-size:22px;margin:5px 0;">Restam <span id="countDemo">02:59</span> para expirar</div>
                    <div style="font-size:12px;opacity:0.8;">Pague para salvar pra sempre + remover marca d'água</div>
                `;
                tarja.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:linear-gradient(90deg,#d32f2f,#FF4D79);color:#fff;text-align:center;padding:20px;font-weight:900;z-index:99999;box-shadow:0 5px 30px rgba(0,0,0,0.5);';
                document.body.prepend(tarja);

                // COUNTDOWN DE 3 MINUTOS
                let tempo = 179;
                const countEl = document.getElementById('countDemo');
                const timer = setInterval(() => {
                    tempo--;
                    const min = Math.floor(tempo / 60).toString().padStart(2, '0');
                    const seg = (tempo % 60).toString().padStart(2, '0');
                    countEl.innerText = `${min}:${seg}`;
                    if (tempo <= 0) {
                        clearInterval(timer);
                        document.body.innerHTML = '<div style="text-align:center;padding:50px;color:#fff;"><h1 style="color:#d32f2f;">⏰ Demo Expirada</h1><p>Sua prévia de 3 minutos acabou.</p><a href="index.html#planos" style="background:#FF4D79;color:#fff;padding:15px 30px;border-radius:50px;text-decoration:none;font-weight:700;display:inline-block;margin-top:20px;">Pagar R$19 e Recuperar</a></div>';
                    }
                }, 1000);

                // BOTÃO COMPRAR ULTRA PREMIUM
                const btn = document.createElement('a');
                btn.href = 'index.html#planos';
                btn.innerHTML = '🔓 Desbloquear Agora - R$19 <span style="text-decoration:line-through;opacity:0.6;margin-left:10px;">R$47</span>';
                btn.style.cssText = 'position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#fff;color:#d32f2f;padding:20px 40px;border-radius:50px;font-weight:900;text-decoration:none;z-index:99999;animation:pulse 1.5s infinite;box-shadow:0 8px 30px rgba(255,255,255,0.3);font-size:18px;';
                document.body.appendChild(btn);

                const style = document.createElement('style');
                style.innerHTML = '@keyframes pulse {0%,100%{transform:translateX(-50%) scale(1);} 50%{transform:translateX(-50%) scale(1.05);}}';
                document.head.appendChild(style);

                // BLOQUEIA PRINT
                document.addEventListener('keyup', (e) => {
                    if (e.key === 'PrintScreen') {
                        document.body.style.filter = 'blur(20px)';
                        setTimeout(() => document.body.style.filter = 'none', 2000);
                        alert('Proteção ativa 🔒\n\nPague para salvar sem marca d\'água');
                    }
                });

                document.addEventListener('contextmenu', e => {
                    e.preventDefault();
                    alert('🔒 Conteúdo protegido\n\nRemova as limitações por R$19');
                });

            } else {
                // MODO NORMAL - PEGA DO FIREBASE
                try {
                    const docRef = doc(db, 'homenagens', id);
                    const docSnap = await getDoc(docRef);

                    if (!docSnap.exists()) {
                        document.getElementById('conteudo').innerHTML = '<div class="erro"><h1>Homenagem não encontrada</h1><p>Verifique o link ou entre em contato.</p></div>';
                        return;
                    }
                    dados = docSnap.data();
                } catch (e) {
                    document.getElementById('conteudo').innerHTML = '<div class="erro"><h1>Erro ao carregar</h1></div>';
                    return;
                }
            }

            // RENDERIZA
            document.getElementById('titulo').innerText = dados.nomes;
            document.getElementById('dataTexto').innerText = new Date(dados.data).toLocaleDateString('pt-BR', {day:'2-digit',month:'long',year:'numeric'});
            document.getElementById('mensagem').innerText = dados.mensagem;

            const inicio = new Date(dados.data);
            const agora = new Date();
            const dias = Math.floor((agora - inicio) / (1000 * 60 * 60 * 24));
            document.getElementById('contador').innerText = `♥ ${dias} dias de amor ♥`;

            let fotosHtml = '';
            if (dados.foto1) fotosHtml += `<img src="${dados.foto1}">`;
            if (dados.foto2) fotosHtml += `<img src="${dados.foto2}">`;
            if (dados.foto3) fotosHtml += `<img src="${dados.foto3}">`;
            document.getElementById('fotos').innerHTML = fotosHtml;

            if (!isDemo && dados.musica) {
                const videoId = dados.musica.match(/(?:v=|\/)([a-zA-Z0-9_-]{11})/)?.[1];
                if (videoId) {
                    document.getElementById('musica').innerHTML = `<iframe width="100%" height="80" src="https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1" frameborder="0" allow="autoplay"></iframe>`;
                }
            } else if (isDemo && dados.musica) {
                document.getElementById('musica').innerHTML = '<div style="color:#888;padding:20px;border:2px dashed #444;border-radius:8px;">🔒 Música bloqueada na demo<br><small>Pague para ativar</small></div>';
            }
        }

        carregar();
    </script>
</body>
</html>
