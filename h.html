<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homenagem - Eterno Amor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Cormorant+Garamond:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(ellipse at top, #1a0a0a 0%, #0a0a0a 50%, #000 100%);
            color: #fff; margin: 0; padding: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
    .card {
            max-width: 650px;
            background: linear-gradient(145deg, rgba(26,26,26,0.9) 0%, rgba(10,10,10,0.95) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,77,121,0.3);
            border-radius: 30px; padding: 60px 40px; text-align: center; position: relative;
            box-shadow: 0 20px 60px rgba(255,77,121,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
        }
    .card::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #FF4D79, #FF8C42, #FF4D79);
            border-radius: 30px; z-index: -1; opacity: 0.3; filter: blur(20px);
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            color: #fff; font-size: 3.5rem; margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(255,77,121,0.5);
            font-weight: 700;
        }
    .data { color: #FFD166; font-size: 1.1rem; margin-bottom: 40px; letter-spacing: 3px; text-transform: uppercase; }
    .contador {
            font-family: 'Cormorant Garamond', serif;
            font-size: 4rem;
            background: linear-gradient(135deg, #FF4D79 0%, #FF8C42 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700; margin: 40px 0;
        }
    .mensagem {
            font-size: 1.2rem; line-height: 2; color: #e0e0e0; margin: 40px 0;
            font-family: 'Cormorant Garamond', serif; font-style: italic;
        }
    .fotos { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin: 40px 0; }
    .fotos img {
            width: 140px; height: 140px; object-fit: cover; border-radius: 20px;
            border: 3px solid rgba(255,77,121,0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s;
        }
    .fotos img:hover { transform: scale(1.05); }
    .musica { margin-top: 30px; position: relative; }
    .erro { text-align: center; padding: 50px; }
    </style>
</head>
<body>
    <div id="conteudo">
        <div class="card">
            <h1 id="titulo">Carregando...</h1>
            <div class="data" id="dataTexto"></div>
            <div class="contador" id="contador"></div>
            <div class="mensagem" id="mensagem"></div>
            <div class="fotos" id="fotos"></div>
            <div class="musica" id="musica"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDuxYHTUyNZav6ewBDVw6OlwYi_h65AGow",
            authDomain: "eterno-amor-prod.firebaseapp.com",
            projectId: "eterno-amor-prod",
            storageBucket: "eterno-amor-prod.firebasestorage.app",
            messagingSenderId: "319651524702",
            appId: "1:319651524702:web:e3ad61bd143633b4cac4cf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const isDemo = urlParams.get('demo') === 'true' || id?.startsWith('demo-');
        const isCriador = urlParams.get('criador') === 'true';

        async function carregar() {
            let dados;

            if (isDemo) {
                // MODO DEMO - PEGA DO LOCALSTORAGE
                dados = JSON.parse(localStorage.getItem(id));

                if (!dados) {
                    document.getElementById('conteudo').innerHTML = '<div class="erro"><h1>Demo expirada</h1><p>Crie uma nova na página inicial.</p></div>';
                    return;
                }

                // MARCA D'ÁGUA NÍVEL PREMIUM
                const tarja = document.createElement('div');
                tarja.innerHTML = `
                    <div style="font-size:14px;opacity:0.9;">VISUALIZAÇÃO BLOQUEADA</div>
                    <div style="font-size:22px;margin:5px 0;">Restam <span id="countDemo">02:59</span> para expirar</div>
                    <div style="font-size:12px;opacity:0.8;">Pague para salvar pra sempre + remover marca d'água</div>
                `;
                tarja.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:linear-gradient(90deg,#d32f2f,#FF4D79);color:#fff;text-align:center;padding:20px;font-weight:900;z-index:99999;box-shadow:0 5px 30px rgba(0,0,0,0.5);';
                document.body.prepend(tarja);

                // COUNTDOWN DE 3 MINUTOS
                let tempo = 179;
                const countEl = document.getElementById('countDemo');
                const timer = setInterval(() => {
                    tempo--;
                    const min = Math.floor(tempo / 60).toString().padStart(2, '0');
                    const seg = (tempo % 60).toString().padStart(2, '0');
                    countEl.innerText = `${min}:${seg}`;
                    if (tempo <= 0) {
                        clearInterval(timer);
                        document.body.innerHTML = '<div style="text-align:center;padding:50px;color:#fff;"><h1 style="color:#d32f2f;">⏰ Demo Expirada</h1><p>Sua prévia de 3 minutos acabou.</p><a href="index.html#planos" style="background:#FF4D79;color:#fff;padding:15px 30px;border-radius:50px;text-decoration:none;font-weight:700;display:inline-block;margin-top:20px;">Pagar R$19 e Recuperar</a></div>';
                    }
                }, 1000);

                // BOTÃO COMPRAR ULTRA PREMIUM
                const btn = document.createElement('a');
                btn.href = 'index.html#planos';
                btn.innerHTML = '🔓 Desbloquear Agora - R$19 <span style="text-decoration:line-through;opacity:0.6;margin-left:10px;">R$47</span>';
                btn.style.cssText = 'position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#fff;color:#d32f2f;padding:20px 40px;border-radius:50px;font-weight:900;text-decoration:none;z-index:99999;animation:pulse 1.5s infinite;box-shadow:0 8px 30px rgba(255,255,255,0.3);font-size:18px;';
                document.body.appendChild(btn);

                const style = document.createElement('style');
                style.innerHTML = '@keyframes pulse {0%,100%{transform:translateX(-50%) scale(1);} 50%{transform:translateX(-50%) scale(1.05);}}';
                document.head.appendChild(style);

                // BLOQUEIA PRINT
                document.addEventListener('keyup', (e) => {
                    if (e.key === 'PrintScreen') {
                        document.body.style.filter = 'blur(20px)';
                        setTimeout(() => document.body.style.filter = 'none', 2000);
                        alert('Proteção ativa 🔒\n\nPague para salvar sem marca d\'água');
                    }
                });

                document.addEventListener('contextmenu', e => {
                    e.preventDefault();
                    alert('🔒 Conteúdo protegido\n\nRemova as limitações por R$19');
                });

            } else {
                // MODO NORMAL - PEGA DO FIREBASE
                try {
                    const docRef = doc(db, 'homenagens', id);
                    const docSnap = await getDoc(docRef);

                    if (!docSnap.exists()) {
                        document.getElementById('conteudo').innerHTML = '<div class="erro"><h1>Homenagem não encontrada</h1><p>Verifique o link ou entre em contato.</p></div>';
                        return;
                    }
                    dados = docSnap.data();
                } catch (e) {
                    document.getElementById('conteudo').innerHTML = '<div class="erro"><h1>Erro ao carregar</h1></div>';
                    return;
                }
            }

            // RENDERIZA
            document.getElementById('titulo').innerText = dados.nomes;
            document.getElementById('dataTexto').innerText = new Date(dados.data).toLocaleDateString('pt-BR', {day:'2-digit',month:'long',year:'numeric'});
            document.getElementById('mensagem').innerText = dados.mensagem;

            const inicio = new Date(dados.data);
            const agora = new Date();
            const dias = Math.floor((agora - inicio) / (1000 * 60 * 60 * 24));
            document.getElementById('contador').innerText = `♥ ${dias} dias de amor ♥`;

            let fotosHtml = '';
            if (dados.foto1) fotosHtml += `<img src="${dados.foto1}">`;
            if (dados.foto2) fotosHtml += `<img src="${dados.foto2}">`;
            if (dados.foto3) fotosHtml += `<img src="${dados.foto3}">`;
            document.getElementById('fotos').innerHTML = fotosHtml;

           if (!isDemo && dados.musica) {
                const videoId = dados.musica.match(/(?:v=|\/)([a-zA-Z0-9_-]{11})/)?.[1];
                if (videoId) {
                    // PLAYER CUSTOMIZADO PREMIUM
                    document.getElementById('musica').innerHTML = `
                        <div id="playerCustom" style="background:linear-gradient(135deg,rgba(255,77,121,0.2),rgba(255,140,66,0.2));border:1px solid rgba(255,77,121,0.4);border-radius:20px;padding:20px;backdrop-filter:blur(10px);">
                            <div style="display:flex;align-items:center;gap:15px;">
                                <div id="btnPlayer" style="width:50px;height:50px;background:linear-gradient(135deg,#FF4D79,#FF8C42);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 5px 15px rgba(255,77,121,0.4);">
                                    <svg id="iconPlay" width="20" height="20" fill="#fff" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                    <svg id="iconPause" width="20" height="20" fill="#fff" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                                </div>
                                <div style="flex:1;">
                                    <div style="color:#FFD166;font-size:12px;letter-spacing:2px;margin-bottom:5px;">TOCANDO AGORA</div>
                                    <div style="color:#fff;font-weight:600;">Música de Vocês</div>
                                    <div id="barraProgresso" style="width:100%;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;margin-top:10px;overflow:hidden;">
                                        <div id="progressoAtual" style="width:0%;height:100%;background:linear-gradient(90deg,#FF4D79,#FF8C42);transition:width 0.3s;"></div>
                                    </div>
                                </div>
                            </div>
                            <div id="ytPlayer" style="display:none;"></div>
                        </div>
                    `;

                    // CARREGA API DO YOUTUBE
                    if (!window.YT) {
                        const tag = document.createElement('script');
                        tag.src = "https://www.youtube.com/iframe_api";
                        document.head.appendChild(tag);
                    }

                    let player;
                    let tocando = false;

                    window.onYouTubeIframeAPIReady = function() {
                        player = new YT.Player('ytPlayer', {
                            height: '0',
                            width: '0',
                            videoId: videoId,
                            playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': videoId },
                            events: {
                                'onReady': onPlayerReady,
                                'onStateChange': onPlayerStateChange
                            }
                        });
                    }

                    function onPlayerReady(event) {
                        // TOCA NO PRIMEIRO CLIQUE EM QUALQUER LUGAR
                        document.body.addEventListener('click', function iniciarMusica() {
                            if (!tocando) {
                                player.playVideo();
                                tocando = true;
                                document.body.removeEventListener('click', iniciarMusica);
                            }
                        }, { once: true });
                    }

                    function onPlayerStateChange(event) {
                        if (event.data == YT.PlayerState.PLAYING) {
                            document.getElementById('iconPlay').style.display = 'none';
                            document.getElementById('iconPause').style.display = 'block';
                            atualizarProgresso();
                        } else {
                            document.getElementById('iconPlay').style.display = 'block';
                            document.getElementById('iconPause').style.display = 'none';
                        }
                    }

                    function atualizarProgresso() {
                        if (player && player.getCurrentTime) {
                            const tempo = player.getCurrentTime();
                            const total = player.getDuration();
                            const porcentagem = (tempo / total) * 100;
                            document.getElementById('progressoAtual').style.width = porcentagem + '%';
                        }
                        if (tocando) requestAnimationFrame(atualizarProgresso);
                    }

                    document.getElementById('btnPlayer').onclick = function() {
                        if (player.getPlayerState() == YT.PlayerState.PLAYING) {
                            player.pauseVideo();
                        } else {
                            player.playVideo();
                            tocando = true;
                        }
                    }
                }
            } else if (isDemo && dados.musica) {
                document.getElementById('musica').innerHTML = '<div style="color:#888;padding:20px;border:2px dashed #444;border-radius:8px;">🔒 Música bloqueada na demo<br><small>Pague para ativar</small></div>';
            }
        }

        carregar();
            
            // PAINEL DO CRIADOR - SÓ QUEM ACABOU DE CRIAR VÊ
            if (isCriador && !isDemo) {
                setTimeout(() => {
                    const painel = document.createElement('div');
                    painel.innerHTML = `
                        <div style="text-align:center;margin-top:50px;padding:30px;background:linear-gradient(145deg,rgba(26,26,26,0.95),rgba(10,10,10,0.98));border:1px solid rgba(255,77,121,0.4);border-radius:20px;backdrop-filter:blur(10px);">
                            <h3 style="color:#FFD166;margin-bottom:20px;font-family:'Cormorant Garamond',serif;font-size:2rem;">Sua homenagem está no ar! 🎉</h3>
                            <p style="color:#ccc;font-size:15px;margin-bottom:25px;">Escolha como quer enviar pro seu amor:</p>
                            
                            <button onclick="copiarLinkHomenagem()" style="background:linear-gradient(135deg,#FF4D79,#FF8C42);color:#fff;border:none;padding:15px 35px;border-radius:50px;margin:8px;cursor:pointer;font-weight:700;font-size:16px;width:280px;">
                                📋 Copiar Link da Homenagem
                            </button><br>
                            
                            <button onclick="gerarQRCode()" style="background:transparent;border:2px solid #FF4D79;color:#FF4D79;padding:15px 35px;border-radius:50px;margin:8px;cursor:pointer;font-weight:700;font-size:16px;width:280px;">
                                📱 Gerar QR Code
                            </button><br>
                            
                            <div id="areaQR" style="margin-top:30px;"></div>
                        
                        </div>
                    `;
                    document.querySelector('.card').after(painel);

                    window.copiarLinkHomenagem = function() {
                        const link = window.location.href.replace('&criador=true','').replace('?criador=true','');
                        const nomes = document.getElementById('nomesCasais')?.innerText || 'nossa história';
                        const textoPronto = `*Fiz uma surpresa pra você* ❤️\n\nClica aqui pra ver: ${link}\n\n_Espero que goste..._`;
                        
                        navigator.clipboard.writeText(textoPronto).then(() => {
                            alert('Texto copiado! ✅\n\nJá colei tudo formatado pra você.\nÉ só abrir o WhatsApp e colar.');
                        });
                    }

                   window.gerarQRCode = function() {
                        const link = window.location.href.replace('&criador=true','').replace('?criador=true','');
                        const nomes = document.getElementById('nomes').innerText || 'Seu Amor';
                        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(link)}`;
                        
                        // Abre janela nova SÓ com QR + Arte pra imprimir
                        const janelaImpressao = window.open('', '_blank', 'width=600,height=700');
                        janelaImpressao.document.write(`
                            <!DOCTYPE html>
                            <html>
                            <head>
                                <title>QR Code - ${nomes}</title>
                                <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
                                <style>
                                    body { 
                                        margin: 0; 
                                        padding: 40px; 
                                        font-family: 'Poppins', sans-serif;
                                        background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
                                        color: #fff;
                                        text-align: center;
                                    }
                                    .card-qr {
                                        background: #1a1a1a;
                                        border: 2px solid #FF4D79;
                                        border-radius: 24px;
                                        padding: 40px 30px;
                                        max-width: 400px;
                                        margin: 0 auto;
                                        box-shadow: 0 20px 60px rgba(255,77,121,0.3);
                                    }
                                    h1 { 
                                        font-family: 'Playfair Display', serif;
                                        color: #FFD166; 
                                        font-size: 2.2rem;
                                        margin-bottom: 10px;
                                    }
                                    .sub { color: #ccc; margin-bottom: 30px; font-size: 14px; }
                                    .qr-box {
                                        background: #fff;
                                        padding: 20px;
                                        border-radius: 16px;
                                        display: inline-block;
                                        margin: 20px 0;
                                    }
                                    .qr-box img { display: block; }
                                    .instrucao { 
                                        color: #FF4D79; 
                                        font-weight: 600; 
                                        margin-top: 25px;
                                        font-size: 16px;
                                    }
                                    .footer { 
                                        margin-top: 30px; 
                                        font-size: 12px; 
                                        color: #666; 
                                    }
                                    @media print {
                                        body { background: #fff; color: #000; }
                                        .card-qr { border: 3px solid #FF4D79; box-shadow: none; }
                                        .no-print { display: none; }
                                    }
                                </style>
                            </head>
                            <body>
                                <div class="card-qr">
                                    <div style="font-size:50px;margin-bottom:15px;">♥</div>
                                    <h1>${nomes}</h1>
                                    <p class="sub">Escaneie para ver nossa homenagem</p>
                                    <div class="qr-box">
                                        <img src="${qrUrl}" width="300" height="300">
                                    </div>
                                    <p class="instrucao">Aponte a câmera do celular</p>
                                    <div class="footer">Eterno Amor • eternoamor.com</div>
                                </div>
                                <button class="no-print" onclick="window.print()" style="background:linear-gradient(135deg,#FF4D79,#FF8C42);color:#fff;border:none;padding:15px 40px;border-radius:50px;margin-top:30px;cursor:pointer;font-weight:700;font-size:16px;">
                                    🖨️ Imprimir Agora
                                </button>
                            </body>
                            </html>
                        `);
                        janelaImpressao.document.close();
                        
                        document.getElementById('areaQR').innerHTML = `
                            <div style="padding:20px;background:#0a0a0a;border-radius:12px;margin-top:20px;">
                                <p style="color:#4CAF50;font-weight:600;">✓ QR Code gerado!</p>
                                <p style="color:#888;font-size:13px;margin-top:8px;">Uma nova janela abriu com a arte pronta pra imprimir.</p>
                            </div>
                        `;
                    }

                }, 1000);
            }

            // RODAPÉ VIRAL - SÓ APARECE PRA QUEM RECEBE O LINK
            if (!isDemo && !isCriador) {
                setTimeout(() => {
                    const rodape = document.createElement('div');
                    rodape.innerHTML = `
                        <div style="text-align:center;margin-top:60px;padding-top:30px;border-top:1px solid rgba(255,77,121,0.2);">
                            <p style="color:#888;font-size:14px;margin-bottom:15px;">Gostou? Crie a sua homenagem também</p>
                            <a href="index.html" style="background:linear-gradient(135deg,#FF4D79,#FF8C42);color:#fff;padding:12px 25px;border-radius:50px;text-decoration:none;font-weight:600;display:inline-block;font-size:14px;">
                                ❤ Fazer minha homenagem
                            </a>
                        </div>
                    `;
                    document.querySelector('.card').appendChild(rodape);
                }, 2000);
            }
    </script>
</body>
</html>
