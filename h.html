<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homenagem - Eterno Amor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #0a0a0a; color: #fff; margin: 0; padding: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
     .card { max-width: 600px; background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%); border: 2px solid #FF4D79; border-radius: 20px; padding: 40px; text-align: center; position: relative; overflow: hidden; }
     .card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,77,121,0.1) 0%, transparent 70%); animation: pulse 4s infinite; }
        h1 { font-family: 'Playfair Display', serif; color: #FF4D79; font-size: 2.5rem; margin-bottom: 10px; position: relative; }
     .data { color: #FFD166; font-size: 1.2rem; margin-bottom: 30px; position: relative; }
     .contador { font-size: 3rem; color: #FF4D79; font-weight: 700; margin: 30px 0; position: relative; }
     .mensagem { font-size: 1.1rem; line-height: 1.8; color: #ccc; margin: 30px 0; position: relative; }
     .fotos { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 30px 0; position: relative; }
     .fotos img { width: 120px; height: 120px; object-fit: cover; border-radius: 12px; border: 2px solid #FF4D79; }
     .musica { margin-top: 30px; position: relative; }
        @keyframes pulse { 0%,100%{opacity: 0.5;} 50%{opacity: 1;} }
     .erro { text-align: center; padding: 50px; }
    </style>
</head>
<body>
    <div id="conteudo">
        <div class="card">
            <h1 id="titulo">Carregando...</h1>
            <div class="data" id="dataTexto"></div>
            <div class="contador" id="contador"></div>
            <div class="mensagem" id="mensagem"></div>
            <div class="fotos" id="fotos"></div>
            <div class="musica" id="musica"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDuxYHTUyNZav6ewBDVw6OlwYi_h65AGow",
            authDomain: "eterno-amor-prod.firebaseapp.com",
            projectId: "eterno-amor-prod",
            storageBucket: "eterno-amor-prod.firebasestorage.app",
            messagingSenderId: "319651524702",
            appId: "1:319651524702:web:e3ad61bd143633b4cac4cf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const isDemo = urlParams.get('demo') === 'true' || id?.startsWith('demo-');

        async function carregar() {
            let dados;

            if (isDemo) {
                // MODO DEMO - PEGA DO LOCALSTORAGE
                dados = JSON.parse(localStorage.getItem(id));

                if (!dados) {
                    document.getElementById('conteudo').innerHTML = '<div class="erro"><h1>Demo expirada</h1><p>Crie uma nova na página inicial.</p></div>';
                    return;
                }

                // MARCA D'ÁGUA GIGANTE
                const tarja = document.createElement('div');
                tarja.innerHTML = 'DEMONSTRAÇÃO - PAGUE PARA REMOVER';
                tarja.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:rgba(255,77,121,0.95);color:#000;text-align:center;padding:15px;font-weight:900;font-size:18px;z-index:99999;letter-spacing:2px;';
                document.body.prepend(tarja);

                // BOTÃO COMPRAR PULSANDO
                const btn = document.createElement('a');
                btn.href = 'index.html#planos';
                btn.innerHTML = '💖 Remover Marca D\'água - R$19';
                btn.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#FF4D79,#FF8C42);color:#fff;padding:18px 35px;border-radius:50px;font-weight:700;text-decoration:none;z-index:99999;animation:pulse 2s infinite;box-shadow:0 5px 20px rgba(255,77,121,0.6);';
                document.body.appendChild(btn);

                const style = document.createElement('style');
                style.innerHTML = '@keyframes pulse {0%,100%{transform:translateX(-50%) scale(1);} 50%{transform:translateX(-50%) scale(1.05);}}';
                document.head.appendChild(style);

            } else {
                // MODO NORMAL - PEGA DO FIREBASE
                try {
                    const docRef = doc(db, 'homenagens', id);
                    const docSnap = await getDoc(docRef);

                    if (!docSnap.exists()) {
                        document.getElementById('conteudo').innerHTML = '<div class="erro"><h1>Homenagem não encontrada</h1><p>Verifique o link ou entre em contato.</p></div>';
                        return;
                    }
                    dados = docSnap.data();
                } catch (e) {
                    document.getElementById('conteudo').innerHTML = '<div class="erro"><h1>Erro ao carregar</h1></div>';
                    return;
                }
            }

            // RENDERIZA
            document.getElementById('titulo').innerText = dados.nomes;
            document.getElementById('dataTexto').innerText = new Date(dados.data).toLocaleDateString('pt-BR', {day:'2-digit',month:'long',year:'numeric'});
            document.getElementById('mensagem').innerText = dados.mensagem;

            // Contador
            const inicio = new Date(dados.data);
            const agora = new Date();
            const dias = Math.floor((agora - inicio) / (1000 * 60 * 60 * 24));
            document.getElementById('contador').innerText = `♥ ${dias} dias de amor ♥`;

            // Fotos
            let fotosHtml = '';
            if (dados.foto1) fotosHtml += `<img src="${dados.foto1}">`;
            if (dados.foto2) fotosHtml += `<img src="${dados.foto2}">`;
            if (dados.foto3) fotosHtml += `<img src="${dados.foto3}">`;
            document.getElementById('fotos').innerHTML = fotosHtml;

            // Música - SÓ TOCA SE NÃO FOR DEMO
            if (!isDemo && dados.musica) {
                const videoId = dados.musica.match(/(?:v=|\/)([a-zA-Z0-9_-]{11})/)?.[1];
                if (videoId) {
                    document.getElementById('musica').innerHTML = `<iframe width="100%" height="80" src="https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1" frameborder="0" allow="autoplay"></iframe>`;
                }
            } else if (isDemo && dados.musica) {
                document.getElementById('musica').innerHTML = '<div style="color:#888;padding:20px;border:2px dashed #444;border-radius:8px;">🔒 Música bloqueada na demo<br><small>Pague para ativar</small></div>';
            }
        }

        carregar();
    </script>
</body>
</html>
