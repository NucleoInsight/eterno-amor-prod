<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Eterno Amor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #0a0a0a; color: #fff; padding: 20px; margin: 0; }
      .container { max-width: 600px; margin: 50px auto; }
      .card { background: #1a1a1a; border: 1px solid #333; padding: 30px; border-radius: 12px; margin-bottom: 20px; }
        h1 { color: #FF4D79; text-align: center; margin-bottom: 30px; }
        h2 { color: #FFD166; font-size: 1.2rem; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: 600; color: #ccc; }
        input, select { width: 100%; padding: 12px; margin-top: 8px; border: 2px solid #333; background: #0a0a0a; color: #fff; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        input:focus, select:focus { border-color: #FF4D79; outline: none; }
        button { background: linear-gradient(135deg, #FF4D79 0%, #FF8C42 100%); color: white; border: none; padding: 15px 30px; margin-top: 20px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; }
        button:hover { opacity: 0.9; }
      .btn-sair { background: transparent; border: 2px solid #666; color: #666; margin-top: 10px; }
      .lista { margin-top: 20px; }
      .item-liberado { background: #0a0a0a; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #FF4D79; display: flex; justify-content: space-between; align-items: center; }
      .item-liberado span { font-size: 14px; }
      .item-liberado button { width: auto; padding: 8px 15px; margin: 0; font-size: 14px; background: #d32f2f; }
      .oculto { display: none; }
      .status { padding: 10px; border-radius: 8px; margin-top: 15px; text-align: center; font-weight: 600; }
      .status.ok { background: #2e7d32; }
      .status.erro { background: #d32f2f; }
      .tag { background: #FF4D79; color: #000; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; }
      .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
      .stat { background: #0a0a0a; padding: 20px; border-radius: 8px; text-align: center; border: 1px solid #333; }
      .stat-num { font-size: 2rem; color: #FF4D79; font-weight: 700; }
      .stat-label { font-size: 12px; color: #888; margin-top: 5px; }
      .btn-copiar { background: #2e7d32; width: auto; padding: 8px 15px; margin: 0 0 0 10px; font-size: 12px; }
      .btn-gerar { background: #333; width: auto; padding: 10px 20px; margin-top: 8px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="login">
            <h1>Painel Admin</h1>
            <label>Senha de Acesso:</label>
            <input type="password" id="senha" placeholder="Digite a senha" onkeypress="if(event.key==='Enter') entrar()">
            <button onclick="entrar()">Entrar</button>
            <div id="msgLogin" class="status erro oculto">Senha incorreta</div>
        </div>

        <div class="card oculto" id="painel">
            <h1>Painel de Vendas</h1>
            
            <div class="dashboard">
                <div class="stat">
                    <div class="stat-num" id="totalLiberados">0</div>
                    <div class="stat-label">HOMENAGENS ATIVAS</div>
                </div>
                <div class="stat">
                    <div class="stat-num" id="vendasHoje">0</div>
                    <div class="stat-label">VENDAS HOJE</div>
                </div>
            </div>
            
           <h2>Nova Liberação Manual</h2>
            <label>Nome do Casal:</label>
            <input type="text" id="nomeLiberar" placeholder="Ex: Gil e Maria">
            <div style="font-size:12px;color:#888;margin-top:5px;">ID será gerado automático: gil-e-maria</div>

           <label>Plano (Limites do Sistema):</label>
            <select id="planoLiberar">
                <option value="essencial">Essencial - 1 foto, s/ música</option>
                <option value="completo">Completo - 5 fotos + música</option>
                <option value="vitalicio">Vitalício - 10 fotos + música + QR + edição</option>
                <option value="marketing">Marketing - Tela de Vendas (index/demo)</option>
            </select>

            <label>Tema (Design e Textos da Página):</label>
            <select id="temaLiberar">
                <option value="casal">💝 Romântico / Casal Padrão</option>
                <option value="maternidade">👶 Maternidade / Mães</option>
                <option value="amizade">⭐ Amizade / Melhores Amigos</option>
                <option value="luto">🕊️ Memorial / Luto</option>
                <option value="pet">🐾 Bichinho de Estimação / Pet</option>
                <option value="aniversario">🎂 Aniversário de Vida</option>
                <option value="casamento">💍 Casamento / Bodas</option>
                <option value="viagem">✈️ Diário de Viagens</option>
                <option value="conquista">🎓 Conquista / Formatura</option>
            </select>

            <button onclick="liberarAcesso()">✓ Liberar Acesso</button>
            <div id="msgStatus" class="status oculto"></div>

            <h2 style="margin-top:40px;color:#FF8C42;">Demos Aguardando Pagamento</h2>
            <div id="listaDemos" class="lista">Carregando...</div>

            <h2 style="margin-top:40px;">Homenagens Liberadas</h2>
            <div id="listaLiberados" class="lista">Carregando...</div>

            <button class="btn-sair" onclick="sair()">Sair do Painel</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, doc, setDoc, getDoc, getDocs, collection, deleteDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // CONFIG DO SEU FIREBASE - ATUALIZADO
        const firebaseConfig = {
            apiKey: "AIzaSyDuxYHTUyNZav6ewBDVw6OlwYi_h65AGow",
            authDomain: "eterno-amor-prod.firebaseapp.com",
            projectId: "eterno-amor-prod",
            storageBucket: "eterno-amor-prod.firebasestorage.app",
            messagingSenderId: "319651524702",
            appId: "1:319651524702:web:e3ad61bd143633b4cac4cf",
            measurementId: "G-GQW96P07R9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const SENHA_CORRETA = '9859';

        async function carregarDemos() {
            const lista = document.getElementById('listaDemos');
            lista.innerHTML = 'Carregando...';
            try {
                const querySnapshot = await getDocs(collection(db, 'demos'));
                if (querySnapshot.empty) {
                    lista.innerHTML = '<div style="color:#666;text-align:center;">Nenhuma demo aguardando</div>';
                    return;
                }
                let html = '';
                querySnapshot.forEach((doc) => {
                    const d = doc.data();
                    const data = new Date(d.criadoEm).toLocaleString('pt-BR');
                    
                    // SEGURANÇA MÁXIMA: Substitui aspas e caracteres perigosos no HTML do botão
                    const nomesSeguros = d.nomes.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    
                    html += `
                        <div class="item-liberado" style="border-left-color:#FF8C42;">
                            <div>
                                <strong>${d.nomes}</strong> <span class="tag" style="background:#FF8C42;">DEMO</span><br>
                                <span style="color:#888;font-size:12px;">Criado em ${data}</span>
                            </div>
                            <div>
                                <button style="background:#2e7d32;" onclick="liberarDemo('${doc.id}','${nomesSeguros}')">Liberar</button>
                            </div>
                        </div>
                    `;
                });
                lista.innerHTML = html;
            } catch (e) {
                lista.innerHTML = `<div style="color:#d32f2f;">Erro: ${e.message}</div>`;
            }
        }

        window.liberarDemo = async function(idDemo, nomes) {
            const listaPlanos = ['essencial', 'completo', 'vitalicio', 'marketing'];
            const listaTemas = ['casal', 'maternidade', 'amizade', 'luto', 'pet', 'aniversario', 'casamento', 'viagem', 'conquista'];
            
            const plano = prompt(`Liberar "${nomes}" em qual plano?\n\nOpções válidas:\n${listaPlanos.join(', ')}`);
            if (!plano || !listaPlanos.includes(plano)) return;

            const tema = prompt(`Liberar "${nomes}" com qual tema?\n\nOpções válidas:\n${listaTemas.join(', ')}`);
            if (!tema || !listaTemas.includes(tema)) return;
            
            // Gera slug do nome
            let id = nomes.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
            
            // Checa se já existe
            const docExistente = await getDoc(doc(db, 'liberados', id));
            if (docExistente.exists()) {
                id = id + '-' + Date.now().toString().slice(-4);
            }

            const limites = {
                essencial: { fotos: 1, musica: false, qr: false, edicao: false },
                completo: { fotos: 5, musica: true, qr: false, edicao: false },
                vitalicio: { fotos: 10, musica: true, qr: true, edicao: true },
                marketing: { fotos: 10, musica: true, qr: true, edicao: true }
            };

            await setDoc(doc(db, 'liberados', id), {
                plano: plano,
                tema: tema,
                limites: limites[plano],
                liberadoEm: serverTimestamp(),
                ativo: true,
                nomes: nomes
            });

            // Apaga da fila de demos
            await deleteDoc(doc(db, 'demos', idDemo));
            
            alert(`✓ Demo liberada com sucesso!\n\nLink para o cliente:\nhttps://nucleoinsight.github.io/eterno-amor-prod/editor.html?id=${id}`);
            carregarDemos();
            carregarLiberados();
        }
        
        window.entrar = function() {
            const senha = document.getElementById('senha').value;
            if (senha === SENHA_CORRETA) {
                document.getElementById('login').classList.add('oculto');
                document.getElementById('painel').classList.remove('oculto');
                carregarLiberados();
                carregarDemos();
            } else {
                document.getElementById('msgLogin').classList.remove('oculto');
                setTimeout(() => document.getElementById('msgLogin').classList.add('oculto'), 3000);
            }
        }

        window.sair = function() {
            document.getElementById('painel').classList.add('oculto');
            document.getElementById('login').classList.remove('oculto');
            document.getElementById('senha').value = '';
        }

       window.liberarAcesso = async function() {
            const nomes = document.getElementById('nomeLiberar').value.trim();
            const plano = document.getElementById('planoLiberar').value;
            const tema = document.getElementById('temaLiberar').value;
            const msg = document.getElementById('msgStatus');

            if (!nomes) {
                msg.innerText = 'Digite o nome de identificação';
                msg.className = 'status erro';
                msg.classList.remove('oculto');
                return;
            }

            // Gera ID automático do nome
            let id = nomes.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
            
            try {
                // Checa se já existe e adiciona sufixo se precisar
                const docExistente = await getDoc(doc(db, 'liberados', id));
                if (docExistente.exists()) {
                    id = id + '-' + Date.now().toString().slice(-4);
                }

                const limites = {
                    essencial: { fotos: 1, musica: false, qr: false, edicao: false },
                    completo: { fotos: 5, musica: true, qr: false, edicao: false },
                    vitalicio: { fotos: 10, musica: true, qr: true, edicao: true },
                    marketing: { fotos: 10, musica: true, qr: true, edicao: true }
                };

                await setDoc(doc(db, 'liberados', id), {
                    plano: plano,
                    tema: tema,
                    limites: limites[plano],
                    liberadoEm: serverTimestamp(),
                    ativo: true,
                    nomes: nomes
                });

                msg.innerText = `✓ ${nomes} liberado!\nLink: editor.html?id=${id}`;
                msg.className = 'status ok';
                msg.classList.remove('oculto');
                document.getElementById('nomeLiberar').value = '';
                carregarLiberados();
                
                setTimeout(() => msg.classList.add('oculto'), 4000);
            } catch (e) {
                msg.innerText = 'Erro ao liberar: ' + e.message;
                msg.className = 'status erro';
                msg.classList.remove('oculto');
            }
        }

        async function carregarLiberados() {
            const lista = document.getElementById('listaLiberados');
            lista.innerHTML = 'Carregando...';
            
            try {
                const querySnapshot = await getDocs(collection(db, 'liberados'));
                if (querySnapshot.empty) {
                    lista.innerHTML = '<div style="color:#666;text-align:center;">Nenhuma homenagem liberada ainda</div>';
                    return;
                }

                // Atualiza dashboard
                document.getElementById('totalLiberados').innerText = querySnapshot.size;
                
                const hoje = new Date().setHours(0,0,0,0);
                let vendasHoje = 0;
                querySnapshot.forEach(doc => {
                    const data = doc.data().liberadoEm?.toDate();
                    if (data && data.setHours(0,0,0,0) === hoje) vendasHoje++;
                });
                document.getElementById('vendasHoje').innerText = vendasHoje;

               let html = '';
                querySnapshot.forEach((doc) => {
                    const dados = doc.data();
                    const data = dados.liberadoEm? new Date(dados.liberadoEm.seconds * 1000).toLocaleDateString('pt-BR') : 'agora';
                    
                    // Tratamento e proteção para mapear links e cadastros antigos do seu banco de dados
                    let planoExibir = dados.plano || 'essencial';
                    let temaExibir = dados.tema || 'casal';
                    
                    const listaTemasLegado = ['maternidade', 'amizade', 'luto', 'pet', 'aniversario', 'casamento', 'viagem', 'conquista'];
                    if (listaTemasLegado.includes(planoExibir)) {
                        temaExibir = planoExibir;
                        planoExibir = 'vitalicio'; // Trata registros legados com as ferramentas completas liberadas
                    }

                    html += `
                        <div class="item-liberado">
                            <div>
                                <strong>${doc.id}</strong> <span class="tag">${planoExibir.toUpperCase()}</span> <span class="tag" style="background:#FF8C42;">${temaExibir.toUpperCase()}</span><br>
                                <span style="color:#888;font-size:12px;">Liberado em ${data}</span><br>
                                <span style="color:#FFD166;font-size:11px;">${dados.limites?.fotos || 1} fotos | ${dados.limites?.musica ? 'Música' : 'S/Música'} | ${dados.limites?.qr ? 'QR' : 'S/QR'} | ${dados.limites?.edicao ? 'Editável' : 'Fixo'}</span>
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 5px; align-items: flex-end;">
                                <button class="btn-copiar" onclick="copiarLink('${doc.id}', '${planoExibir}', '${dados.nomes || ''}')">📋 Copiar WhatsApp</button>
                                <div style="display: flex; gap: 5px;">
                                    <button onclick="alterarPlano('${doc.id}', '${dados.nomes || ''}')" style="background: #b57c1e; font-size: 12px; padding: 6px 10px; margin: 0; width: auto;">⚙️ Mudar Plano</button>
                                    <button onclick="bloquear('${doc.id}')" style="font-size: 12px; padding: 6px 10px; margin: 0; width: auto;">Bloquear</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                lista.innerHTML = html;
            } catch (e) {
                lista.innerHTML = `<div style="color:#d32f2f;">Erro ao carregar: ${e.message}</div>`;
            }
        }

               window.copiarLink = function(id, plano, nomes) {
            const link = `https://nucleoinsight.github.io/eterno-amor-prod/editor.html?id=${id}`;
            const mapasPlanos = { 
                essencial: 'ESSENCIAL', completo: 'COMPLETO', vitalicio: 'VITALÍCIO', marketing: 'MARKETING',
                maternidade: 'MATERNIDADE', amizade: 'AMIZADE', luto: 'MEMORIAL', pet: 'PET',
                aniversario: 'ANIVERSÁRIO', casamento: 'CASAMENTO/BODAS', viagem: 'DIÁRIO DE VIAGEM', conquista: 'CONQUISTA'
            };
            const nomePlano = mapasPlanos[plano] || plano.toUpperCase();
            const nomeCliente = nomes || 'você';
            
            let texto = '';

            if (plano === 'marketing') {
                texto = `*Eterno Amor | Link de Divulgação Pronto!* 🚀\n\n` +
                        `Seu link estratégico focado em atração e vendas foi gerado com sucesso!\n\n` +
                        `*Plano:* ${nomePlano}\n` +
                        `*Link para Alimentar/Editar (Painel):*\n${link}\n\n` +
                        `*Link de Visualização Final (Público):*\nhttps://nucleoinsight.github.io/eterno-amor-prod/h.html?id=${id}\n\n` +
                        `👉 *Como usar:*\n` +
                        `Use o link para alimentar com uma história real ou fictícia marcante. O link final esconderá os botões de criador e exibirá a nossa copy de vendas com redirecionamento direto! 🔥\n\n` +
                        `*Eterno Amor*`;
            } else {
                texto = `*Eterno Amor | Acesso Liberado* 💝\n\n` +
                        `Olá ${nomeCliente}! Seu *presente especial* está pronto!\n\n` +
                        `*Plano:* ${nomePlano}\n` +
                        `*Seu link exclusivo:*\n${link}\n\n` +
                        `👉 *Como usar:*\n` +
                        `1. Clique no link\n` +
                        `2. Preencha com as fotos, música e informações\n` +
                        `3. Salve e surpreenda quem você ama\n\n`;
                
                texto += `*QR Code exclusivo* pra imprimir e usar 🎁\n`;
                
                if (plano === 'essencial') {
                    texto += `Página personalizada com contador de tempo exclusivo 💝\n\n`;
                } else if (plano === 'completo') {
                    texto += `Música que toca sozinha + até *5 fotos* dos melhores momentos 🎵\n\n`;
                } else {
                    texto += `*Página pra sempre no ar* + pode *editar quando quiser* ✨\n\n`;
                }
                
                texto += `_Link válido por 7 dias. Dúvidas? Chama aqui!_\n\n*Eterno Amor*`;
            }
            
            navigator.clipboard.writeText(texto);
            alert('✅ Texto pro WhatsApp copiado!\n\nJá tá formatado com negrito. É só colar.');
        }
        
       window.bloquear = async function(id) {
            if (!confirm(`Bloquear o ID ${id}? O cliente vai perder acesso.`)) return;
            
            try {
                await deleteDoc(doc(db, 'liberados', id));
                carregarLiberados();
            } catch (e) {
                alert('Erro ao bloquear: ' + e.message);
            }
        }

       window.alterarPlano = async function(id, nomes) {
            const listaPlanos = ['essencial', 'completo', 'vitalicio', 'marketing'];
            const listaTemas = ['casal', 'maternidade', 'amizade', 'luto', 'pet', 'aniversario', 'casamento', 'viagem', 'conquista'];
            
            const novoPlano = prompt(`Alterar o plano de "${nomes || id}" para qual?\n\nOpções válidas:\n${listaPlanos.join(', ')}`);
            if (!novoPlano || !listaPlanos.includes(novoPlano)) {
                alert('Alteração cancelada ou plano incorreto.');
                return;
            }

            const novoTema = prompt(`Alterar o tema de "${nomes || id}" para qual?\n\nOpções válidas:\n${listaTemas.join(', ')}`);
            if (!novoTema || !listaTemas.includes(novoTema)) {
                alert('Alteração cancelada ou tema incorreto.');
                return;
            }

            const limites = {
                essencial: { fotos: 1, musica: false, qr: false, edicao: false },
                completo: { fotos: 5, musica: true, qr: false, edicao: false },
                vitalicio: { fotos: 10, musica: true, qr: true, edicao: true },
                marketing: { fotos: 10, musica: true, qr: true, edicao: true }
            };

            try {
                // Atualiza o documento do cliente com o novo plano, tema e limites
                await setDoc(doc(db, 'liberados', id), {
                    plano: novoPlano,
                    tema: novoTema,
                    limites: limites[novoPlano]
                }, { merge: true });

                alert(`✓ Cadastro de ${id} atualizado com sucesso! Plano: ${novoPlano.toUpperCase()} | Tema: ${novoTema.toUpperCase()}`);
                carregarLiberados();
            } catch (e) {
                alert('Erro ao alterar cadastro: ' + e.message);
            }
        }
    </script>
</body>
</html>
